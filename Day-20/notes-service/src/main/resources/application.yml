server:
  port: 8082

spring:
  application:
    name: notes-service

  datasource:
    url: jdbc:mysql://localhost:3306/fundoo_notes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: PassWord

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  activemq:
    in-memory: true

  jms:
    pub-sub-domain: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5000ms
        failureRateThreshold: 50

management:
  endpoints:
    web:
      exposure:
        include: "*"
