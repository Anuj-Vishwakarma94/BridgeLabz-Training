server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**, /auth/**

        - id: notes-service
          uri: lb://NOTES-SERVICE
          predicates:
            - Path=/api/notes/**, /notes/**, /api/labels/**, /labels/**, /api/batch/**

        - id: reminder-service
          uri: lb://REMINDER-SERVICE
          predicates:
            - Path=/api/reminders/**, /reminders/**

        - id: admin-server
          uri: lb://ADMIN-SERVER
          predicates:
            - Path=/admin/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
