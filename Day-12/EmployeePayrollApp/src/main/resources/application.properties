spring.application.name=EmployeePayrollApp

# ── H2 Datasource ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:payrolldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── H2 Console ────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ───────────────────────────────────────────────────────
# 'update' lets Hibernate auto-create/update tables from @Entity classes.
# Use 'create-drop' for a clean slate on every restart (useful in dev).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── Disable schema.sql (Hibernate now manages DDL) ────────────────────────
spring.sql.init.mode=never

# ── Swagger / SpringDoc OpenAPI ─────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

