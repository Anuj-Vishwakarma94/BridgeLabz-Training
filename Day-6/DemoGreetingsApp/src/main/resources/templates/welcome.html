<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container { text-align: center; }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .name {
            font-size: 1.3rem;
            color: #aaa;
            margin-bottom: 36px;
        }

        .success {
            color: #4ade80;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        a, form button {
            display: block;
            width: 200px;
            padding: 10px;
            text-align: center;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: sans-serif;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }

        .btn-outline {
            color: #fff;
            border: 1px solid #fff;
            background: transparent;
        }
        .btn-outline:hover { background: #fff; color: #000; }

        .btn-danger {
            color: #f87171;
            border: 1px solid #f87171;
            background: transparent;
        }
        .btn-danger:hover { background: #f87171; color: #000; }

        form { margin: 0; }
        form button { border: 1px solid #f87171; background: transparent; color: #f87171; }
        form button:hover { background: #f87171; color: #000; }

        .divider {
            width: 200px;
            height: 1px;
            background: #222;
            margin: 4px auto;
        }

        .label {
            font-size: 0.7rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome,</h1>
        <p class="name" th:text="${name}">User</p>

        <p class="success" th:if="${success}" th:text="${success}"></p>

        <div class="actions">

            <span class="label">Account</span>

            <a href="/update-password" class="btn-outline">Update Password</a>

            <div class="divider"></div>

            <form action="/delete-account" method="post"
                  onsubmit="return confirm('Are you sure you want to delete your account? This cannot be undone.')">
                <button type="submit">Delete Account</button>
            </form>

            <div class="divider"></div>

            <a href="/logout" class="btn-outline">Logout</a>

        </div>
    </div>
</body>
</html>
