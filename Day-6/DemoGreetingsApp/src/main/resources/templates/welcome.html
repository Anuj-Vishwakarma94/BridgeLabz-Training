<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome — DemoGreetingsApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            color: #e2e8f0;
            overflow: hidden;
        }

        .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .orb {
            position: absolute; border-radius: 50%;
            filter: blur(90px); opacity: 0.2;
            animation: floatOrb 10s ease-in-out infinite;
        }
        .orb-1 { width: 600px; height: 600px; background: #34d399; top: -200px; right: -150px; animation-delay: 0s; }
        .orb-2 { width: 450px; height: 450px; background: #6366f1; bottom: -150px; left: -100px; animation-delay: 5s; }

        @keyframes floatOrb {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.08) translateY(-20px); }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 56px 52px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to   { opacity: 1; transform: scale(1); }
        }

        .success-ring {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #34d399, #10b981);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin-bottom: 24px;
            box-shadow: 0 0 0 12px rgba(52,211,153,0.12), 0 0 0 24px rgba(52,211,153,0.06);
            animation: pulseRing 2.5s ease-in-out infinite;
        }

        @keyframes pulseRing {
            0%, 100% { box-shadow: 0 0 0 12px rgba(52,211,153,0.12), 0 0 0 24px rgba(52,211,153,0.06); }
            50% { box-shadow: 0 0 0 16px rgba(52,211,153,0.18), 0 0 0 30px rgba(52,211,153,0.08); }
        }

        .greeting-label {
            font-size: 0.78rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #34d399;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff, rgba(255,255,255,0.65));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .user-name {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #34d399, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .divider {
            width: 40px;
            height: 3px;
            background: linear-gradient(135deg, #34d399, #a78bfa);
            border-radius: 10px;
            margin: 20px auto;
        }

        .subtitle {
            color: rgba(255,255,255,0.45);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-home {
            padding: 12px 28px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-home:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }

        .btn-logout {
            padding: 12px 28px;
            background: linear-gradient(135deg, #34d399, #10b981);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(16,185,129,0.35);
        }
        .btn-logout:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(16,185,129,0.45);
        }
    </style>
</head>
<body>

<div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
</div>

<div class="card">
    <div class="success-ring">✓</div>

    <div class="greeting-label">Login Successful</div>
    <h1>Hello,</h1>
    <div class="user-name" th:text="${name}">User</div>

    <div class="divider"></div>

    <p class="subtitle">You're now logged in. Welcome to the DemoGreetingsApp — your session is active and ready to go.</p>

    <div class="actions">
        <a href="/" class="btn-home">← Go Home</a>
        <a href="/login" class="btn-logout">Sign Out</a>
    </div>
</div>

</body>
</html>
